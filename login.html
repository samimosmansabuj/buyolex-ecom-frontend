<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="/">
  <script src="js/theme-init.js?v=9165bf92"></script>
  <script src="js/spa-router.js?v=15670031"></script>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <title>Login — Buyolex</title>
  <meta name="description" content="Log in or create your Buyolex account with your phone number.">
  <link rel="stylesheet" href="css/base.css?v=9ad603a4">
  <link rel="stylesheet" href="css/layout.css?v=c82e4dcd">
  <link rel="stylesheet" href="css/shell.css?v=338090d5">
  <link rel="stylesheet" href="css/auth.css?v=0b6d666f">
</head>
<body>

  <div id="global-loader" class="global-loader" aria-hidden="true"><svg viewBox="0 0 64 64" width="64" height="64" fill="currentColor" aria-hidden="true"><rect x="31" y="6" width="11" height="28" rx="5.5" transform="rotate(45 36.5 20)"/><path d="M22.7 26L30.5 33.8L10 54Z"/><path d="M38 30L56 40L48 42L45 55Z"/><path d="M30 5Q30 9 34 9Q30 9 30 13Q30 9 26 9Q30 9 30 5Z"/><path d="M57 6Q57 9 60 9Q57 9 57 12Q57 9 54 9Q57 9 57 6Z"/><path d="M58 19.5Q58 22 60.5 22Q58 22 58 24.5Q58 22 55.5 22Q58 22 58 19.5Z"/></svg></div>

  <div id="promo-container"></div>
  <div id="topnavbar-container"></div>

  <main id="app" class="wrap">

    <div class="auth-box panel g" id="authBox">
      <div class="auth-head"><h1 class="page-title" style="margin:0">Login</h1><span class="mute small">New here? Enter your number to create an account.</span></div>

      <form id="phoneStep" class="auth-form" novalidate>
        <label class="auth-label" for="loginPhone">Phone number</label>
        <input id="loginPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">
        <button class="cta" id="phoneNextBtn">Next</button>
      </form>

      <form id="passwordStep" class="auth-form" hidden novalidate>
        <p id="passwordStepLabel" class="mute">Enter your password</p>
        <div class="pw-wrap">
          <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
          <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password">Show</button>
        </div>
        <button class="cta" id="submitPasswordBtn">Continue</button>
        <button type="button" class="link-btn" id="forgotPasswordBtn" hidden>Forgot password?</button>
        <button type="button" class="link-btn" data-back>← Back</button>
      </form>

      <form id="otpStep" class="auth-form" hidden novalidate>
        <p class="mute">Enter the 6-digit OTP sent to your phone</p>
        <input id="resetOtp" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit OTP">
        <button class="cta" id="submitOtpBtn">Verify OTP</button>
        <button type="button" class="link-btn" id="resendOtpBtn">Resend OTP</button>
        <button type="button" class="link-btn" data-back>← Back</button>
      </form>

      <form id="newPasswordStep" class="auth-form" hidden novalidate>
        <p class="mute">Set a new password</p>
        <input id="newPassword" type="password" placeholder="New password (6+ characters)" autocomplete="new-password">
        <button class="cta" id="submitNewPasswordBtn">Reset password</button>
        <button type="button" class="link-btn" data-back>← Back</button>
      </form>

      <div id="googleAuth" class="google-auth" hidden>
        <div class="google-auth-divider"><span>or</span></div>
        <div id="googleBtn" class="google-auth-btn"></div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container"></div>
  <div id="drawer-container"></div>
  <div id="cart-drawer-container"></div>
  <div id="mobile-bottom-nav-container"></div>
  <div id="float-wa-container"></div>

  <script src="js/env.js?v=a1a9f96f"></script>
  <script src="js/config.js?v=4c97a868"></script>
  <script src="js/api.js?v=79f2895f"></script>
  <script src="js/loadComponents.js?v=8367156a"></script>
  <script src="js/main.js?v=656f772a"></script>
  <script src="js/tracking.js?v=a51253df"></script>
  <script src="js/activity-tracker.js?v=d0796638"></script>
  <script src="js/marketing.js?v=4b47f38c"></script>
  <script src="js/bx-events.js?v=8977c6ad"></script>
  <script src="js/cart-drawer.js?v=f8668bce"></script>
  <script src="js/site-content.js?v=f0138b39"></script>
  <script src="js/auth.js?v=293af623"></script>
</body>
</html>
